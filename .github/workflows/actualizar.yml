name: Actualizar datos de la campaña

on:
  schedule:
    # 06:15 UTC = 08:15 en España (verano) / 07:15 (invierno).
    # A esa hora los datos de ayer ya están cerrados en Meta.
    - cron: "15 6 * * *"
  workflow_dispatch:        # botón «Run workflow» para forzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar de Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        # El script sale con error si falta la clave, si Windsor responde mal o
        # si devuelve cero filas. En cualquiera de esos casos el paso falla,
        # GitHub avisa por email y el data.json anterior se queda intacto.
        run: python3 fetch_data.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git push
          fi
